name: CI/CD EADL4

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - run: mvn clean compile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - run: mvn verify
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco

  sonar:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - run: mvn verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN_1 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [sonar]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - run: mvn package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t $REGISTRY/${{ github.repository }}:${{ github.sha }} .
          docker tag $REGISTRY/${{ github.repository }}:${{ github.sha }} \
                     $REGISTRY/${{ github.repository }}:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Push image
        run: |
          docker push $REGISTRY/${{ github.repository }}:${{ github.sha }}
          docker push $REGISTRY/${{ github.repository }}:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.app.internal
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: staging.internal
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
            docker stop eadl4-app || true
            docker rm eadl4-app || true
            docker run -d --name eadl4-app -p 80:8080 \
              ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://app.internal
    steps:
      - name: Deploy to web1
        uses: appleboy/ssh-action@v1
        with:
          host: web1.internal
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
            docker stop eadl4-app || true
            docker rm eadl4-app || true
            docker run -d --name eadl4-app -p 80:8080 \
              ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}

      - name: Deploy to web2
        uses: appleboy/ssh-action@v1
        with:
          host: web2.internal
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
            docker stop eadl4-app || true
            docker rm eadl4-app || true
            docker run -d --name eadl4-app -p 80:8080 \
              ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
