name: CI/CD EADL4

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - run: mvn clean compile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - run: mvn verify
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco

  sonar:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - run: mvn verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN_1 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [sonar]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - run: mvn package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t $REGISTRY/${{ github.repository }}:${{ github.sha }} .
          docker tag $REGISTRY/${{ github.repository }}:${{ github.sha }} \
                     $REGISTRY/${{ github.repository }}:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Push image
        run: |
          docker push $REGISTRY/${{ github.repository }}:${{ github.sha }}
          docker push $REGISTRY/${{ github.repository }}:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.app.internal
    steps:
      - name: Simulate deploy to staging
        run: |
          echo "=== DEPLOY STAGING (simulated) ==="
          echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}"
          echo "docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}"
          echo "docker stop eadl4-app || true"
          echo "docker rm eadl4-app || true"
          echo "docker run -d --name eadl4-app -p 80:8080 \$IMAGE"
          echo "=== DEPLOY COMPLETE ==="

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://app.internal
    steps:
      - name: Simulate deploy to web1
        run: |
          echo "=== DEPLOY PROD - web1 (simulated) ==="
          echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}"
          echo "docker pull \$IMAGE && docker stop eadl4-app || true"
          echo "docker rm eadl4-app || true && docker run -d --name eadl4-app -p 80:8080 \$IMAGE"
          echo "=== DONE ==="
      - name: Simulate deploy to web2
        run: |
          echo "=== DEPLOY PROD - web2 (simulated) ==="
          echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}"
          echo "docker pull \$IMAGE && docker stop eadl4-app || true"
          echo "docker rm eadl4-app || true && docker run -d --name eadl4-app -p 80:8080 \$IMAGE"
          echo "=== DONE ==="
